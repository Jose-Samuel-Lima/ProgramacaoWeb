<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    
    <title>Receita JavaScript Básico 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .cerveja {
            padding: 12px;
            margin: 8px 0;
            border: 3px solid black;
            border-radius: 8px;
            width: 250px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            border: 3px solid black;
            margin-top: 15px;
            width: 350px;
        }

        th,
        td {
            border: 3px solid black;
            padding: 10px;
            text-align: left;
        }

        tr:nth-child(odd) {
            background-color: lightgray;
        }

        tr:nth-child(even) {
            background-color: white;
        }

        th {
            background-color: lightblue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Exercícios - JavaScript Básico 2</h1>

    <div id="meu-amor">

        <button id="botaoDiv">
            Mostrar Divs
        </button>

        <button id="botaoEstilo">
            Mostrar Estilizadas
        </button>

        <button id="botaoTabela">
            Mostrar Tabela
        </button>

        <button id="botaoOrdenar">
            Ordenar
        </button>

        <button id="botaoEmbaralhar">
            Embaralhar
        </button>

        <div id="resultado"></div>

    </div>


    <script>

        let cervejas = [
            "Guiness",
            "Desperados",
            "Becks"
        ];


        function transformarDiv(item) {

            return `<div class="cerveja">${item}</div>`;

        }


        function transformarTabela(item) {

            return `<tr><td>${item}</td></tr>`;

        }


        function mostrarDivs() {

            let div = document.getElementById("resultado");

            let cervejasHtml = cervejas.map(transformarDiv);

            div.innerHTML = cervejasHtml.join("\n");

        }


        function mostrarTabela() {

            let div = document.getElementById("resultado");

            let cervejasHtml = cervejas.map(transformarTabela);

            div.innerHTML = `
                <table>
                    <tr>
                        <th>Cervejas</th>
                    </tr>

                    ${cervejasHtml.join("\n")}
                </table>
            `;

        }


        function ordenarCervejas() {

            cervejas.sort();

            mostrarDivs();

        }


        function embaralharCervejas() {

            cervejas.sort(() => Math.random() - 0.5);

            mostrarDivs();

        }


        let botaoDiv = document.getElementById("botaoDiv");

        botaoDiv.addEventListener("click", mostrarDivs);


        let botaoEstilo = document.getElementById("botaoEstilo");

        botaoEstilo.addEventListener("click", mostrarDivs);


        let botaoTabela = document.getElementById("botaoTabela");

        botaoTabela.addEventListener("click", mostrarTabela);


        let botaoOrdenar = document.getElementById("botaoOrdenar");

        botaoOrdenar.addEventListener("click", ordenarCervejas);


        let botaoEmbaralhar = document.getElementById("botaoEmbaralhar");

        botaoEmbaralhar.addEventListener("click", embaralharCervejas);

    </script>

</body>

</html>
